name: Validate

# HACS's own publishing requirements (https://hacs.xyz/docs/publish/include/)
# call for both of these checks passing before a PR is submitted -- hence
# push/pull_request/schedule, matching the exact trigger set both actions'
# own official docs use, not just tag pushes like release.yml.
# "on" is quoted deliberately -- unquoted, some YAML parsers (YAML 1.1)
# interpret the bare word as the boolean `true` instead of the literal
# key GitHub/Forgejo Actions expects.
"on":
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      # This project is mirrored to GitHub (github.com/r3pek/ha-mobius),
      # which is what makes this job meaningful at all -- HACS itself
      # (both this validation action and the real installation flow in
      # Home Assistant) is built entirely around GitHub; it has no
      # concept of a Forgejo-only repo. references github.com directly,
      # not a code.forgejo.org-mirrored action like the rest of this
      # project's workflows do -- hacs/action isn't mirrored there.
      #
      # repository input set explicitly to the GitHub mirror's path --
      # left to auto-detect, it would resolve to the Forgejo repo's own
      # path via this run's environment, which happens to be the same
      # string ("r3pek/ha-mobius") but isn't actually where the action
      # needs to look; being explicit here doesn't rely on that
      # coincidence continuing to hold.
      #
      # github_token is REQUIRED here and is NOT secrets.GITHUB_TOKEN --
      # confirmed via a real failure on this exact job (401, "Repository
      # ... not loaded properly in HACS"): this action authenticates to
      # api.github.com specifically, and Forgejo's automatic
      # secrets.GITHUB_TOKEN is a Forgejo-scoped token, meaningless to
      # GitHub's API. Needs a real GitHub Personal Access Token (public
      # repo read access is enough) stored as its own secret --
      # GH_MIRROR_TOKEN here, deliberately not named GITHUB_TOKEN since
      # that name is already reserved for Forgejo's own auto-provided one.
      #
      # category: "integration" -- confirmed required input, per
      # https://hacs.xyz/docs/publish/action/; this repo's hacs.json has
      # no "render_readme"-adjacent category field of its own, so this
      # is the one place that classification needs to be stated.
      # comment: "false" -- the action's default (true) posts a PR
      # comment with the validation result via GitHub's API specifically;
      # not applicable here and would presumably just fail or no-op
      # against a Forgejo PR, so disabled explicitly rather than left to
      # find out.
      - name: HACS validation
        uses: https://github.com/hacs/action@main
        with:
          category: "integration"
          comment: "false"
          repository: "r3pek/ha-mobius"
          github_token: ${{ secrets.GH_MIRROR_TOKEN }}

  hassfest:
    # dind label -> docker:dind (the official Docker-in-Docker image, with
    # its OWN nested daemon, not sharing this runner host's socket at all)
    # -- a different, better fix than the earlier Docker-socket-mounting
    # approach for this specific job. That approach shares the runner
    # HOST's own daemon, and hassfest's action does `docker run -v
    # <workspace-path>:...`, where <workspace-path> only exists inside
    # this job's own container, not on the actual host filesystem the
    # shared daemon looks in -- confirmed via a real failure ("No
    # integrations found!", an empty mount) on this exact job. A truly
    # separate nested daemon, running INSIDE this job's own container,
    # doesn't have that mismatch: the workspace path DOES exist from
    # its point of view, since it's the same container's filesystem.
    #
    # docker:dind is Alpine-based with no Node.js, so actions/checkout
    # (a Node-based action) won't run here -- checkout is a plain git
    # clone instead, git installed explicitly since a minimal Alpine
    # image doesn't have it.
    #
    # defaults.run.shell: sh -- covers this job's OWN two run: steps
    # below (neither is bash-specific: apk/git/dockerd/until-do-done/&
    # backgrounding are all plain POSIX). Doesn't cover the third
    # (hassfest itself): that's a third-party composite action, and a
    # composite action's own internal run steps use whatever shell its
    # author specified, independent of the calling job's defaults --
    # confirmed via a real failure that persisted even after adding this
    # defaults setting, meaning hassfest's own action.yml hardcodes bash
    # for its steps regardless. bash installed explicitly below for that
    # reason, rather than trying to work around a third-party action's
    # own shell choice.
    runs-on: dind
    defaults:
      run:
        shell: sh
    steps:
      - name: Install git, checkout
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk add --no-cache git bash
          git -c http.extraheader="Authorization: Bearer ${FORGEJO_TOKEN}" \
            clone --depth 1 --branch "${{ github.ref_name }}" \
            https://code.r3pek.org/r3pek/ha-mobius.git .

      # act_runner overrides this image's own entrypoint (the part that
      # would normally auto-start dockerd) with its own "keep the
      # container alive for step-by-step execution" entrypoint -- so the
      # nested daemon needs to be started explicitly here, not assumed to
      # already be running just because this is the dind image. Waits for
      # it to actually respond before moving on, rather than assuming a
      # fixed sleep is long enough.
      - name: Start nested Docker daemon
        run: |
          dockerd &
          timeout 30 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'

      - name: Hassfest validation
        uses: https://github.com/home-assistant/actions/hassfest@master
