name: Test

# Runs on every push/PR, unconditionally -- including tag pushes.
# release.yml also calls this workflow as its own "test" job
# (workflow_call below), so a tag push runs the suite twice: once here,
# once via that call. Deliberate -- this workflow always running the
# same way regardless of ref type matters more than avoiding that
# duplication.
"on":
  push:
  pull_request:
  workflow_dispatch:
  workflow_call: {}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Set up Python
        # 3.14, not 3.12 -- pytest-homeassistant-custom-component>=0.13.344
        # (see requirements_test.txt) requires it: HA itself moved to
        # requiring Python 3.14 starting with version 2026.3.1, confirmed
        # directly against that package's own PyPI metadata across the
        # 0.13.316/0.13.317 boundary (>=3.13 vs >=3.14) when this
        # constraint was first introduced. An earlier version of this
        # workflow file was never updated to match when that constraint
        # was added, which broke this step outright (pip cannot install a
        # package requiring Python >=3.14 into a 3.12 environment).
        uses: https://code.forgejo.org/actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          # Also covers manifest.json -- its own dependencies are
          # installed separately below, and were left out of the cache
          # key otherwise.
          cache-dependency-path: |
            requirements_test.txt
            custom_components/mobius/manifest.json

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      # manifest.json's own "requirements" are what Home Assistant
      # installs at runtime -- read from there rather than duplicated
      # here, so they can't drift out of sync.
      - name: Install integration runtime requirements (from manifest.json)
        run: |
          python3 -c "import json,sys; sys.stdout.write('\n'.join(json.load(open('custom_components/mobius/manifest.json'))['requirements']))" > /tmp/manifest_requirements.txt
          pip install -r /tmp/manifest_requirements.txt

      # `python -m pytest`, not bare `pytest` -- the former puts the
      # repo root on sys.path, which custom_components.mobius needs.
      - name: Run tests
        run: python -m pytest tests/ -q
