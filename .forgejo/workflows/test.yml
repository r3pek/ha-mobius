name: Test

# Runs on every push/PR. Separate from release.yml (tag pushes only)
# and validate.yml (HACS/hassfest rules) -- different concerns.
#
# tags-ignore excludes tag pushes: release.yml's "test" job calls this
# workflow directly (workflow_call below) as its own prerequisite, so
# without this a tag push would run the suite twice.
"on":
  push:
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call: {}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Set up Python
        uses: https://code.forgejo.org/actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      # manifest.json's own "requirements" are what Home Assistant
      # installs at runtime -- read from there rather than duplicated
      # here, so they can't drift out of sync.
      - name: Install integration runtime requirements (from manifest.json)
        run: |
          python3 -c "import json,sys; sys.stdout.write('\n'.join(json.load(open('custom_components/mobius/manifest.json'))['requirements']))" > /tmp/manifest_requirements.txt
          pip install -r /tmp/manifest_requirements.txt

      # `python -m pytest`, not bare `pytest` -- the former puts the
      # repo root on sys.path, which custom_components.mobius needs.
      - name: Run tests
        run: python -m pytest tests/ -q
