name: Test

# Runs on every push/PR, unconditionally -- including tag pushes.
# release.yml also calls this workflow as its own "test" job
# (workflow_call below), so a tag push runs the suite twice: once here,
# once via that call. Deliberate -- this workflow always running the
# same way regardless of ref type matters more than avoiding that
# duplication.
"on":
  push:
  pull_request:
  workflow_dispatch:
  workflow_call: {}

jobs:
  test:
    name: test (HA ${{ matrix.ha }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # hacs.json's minimum. Its test harness, the retired
          # pytest-homeassistant-custom-component, pins Home Assistant.
          - ha: "2026.8"
            harness: "pytest-homeassistant-custom-component==0.13.354"
          # The latest Home Assistant, with the harness it ships since
          # 2026.11.
          - ha: latest
            harness: "pytest-homeassistant[bluetooth]"
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Set up Python
        # 3.14: Home Assistant requires it since 2026.3.1, and so do both
        # test harnesses (see the matrix above).
        uses: https://code.forgejo.org/actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          # Also covers manifest.json -- its own dependencies are
          # installed separately below, and were left out of the cache
          # key otherwise.
          cache-dependency-path: |
            requirements_test.txt
            custom_components/mobius/manifest.json

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.harness }}" -r requirements_test.txt

      # manifest.json's own "requirements" are what Home Assistant
      # installs at runtime -- read from there rather than duplicated
      # here, so they can't drift out of sync. On a tag (a release
      # build), python-mobius is installed from here too, exactly as
      # published -- the same PyPI version pin (python-mobius~=X.Y.Z)
      # a real end-user install gets, so a release only ever gets
      # tagged against what's actually publicly installable right now,
      # not whatever happens to be sitting on python-mobius's own
      # unreleased default branch at the moment this runs. On any
      # other ref, python-mobius is deliberately excluded here and
      # installed separately from its own git repo instead -- see that
      # step's own comment below for why.
      - name: Install integration runtime requirements (from manifest.json)
        if: github.ref_type == 'tag'
        run: |
          python3 -c "import json,sys; sys.stdout.write('\n'.join(json.load(open('custom_components/mobius/manifest.json'))['requirements']))" > /tmp/manifest_requirements.txt
          pip install -r /tmp/manifest_requirements.txt

      - name: Install integration runtime requirements (from manifest.json, except python-mobius)
        if: github.ref_type != 'tag'
        run: |
          python3 -c "import json,sys; sys.stdout.write('\n'.join(r for r in json.load(open('custom_components/mobius/manifest.json'))['requirements'] if not r.startswith('python-mobius')))" > /tmp/manifest_requirements.txt
          pip install -r /tmp/manifest_requirements.txt

      # Only on a non-tag ref -- see the step above for the tag case,
      # which installs python-mobius from manifest.json's own PyPI pin
      # instead, deliberately skipping this one entirely.
      #
      # manifest.json's own python-mobius requirement is a PyPI version
      # pin (python-mobius~=X.Y.Z) -- necessary for real end-user Home
      # Assistant installs, which can only pull from PyPI, but that
      # means CI could only ever test against whatever's already been
      # formally released there. This installs the latest commit on
      # python-mobius's own default branch directly from its git repo
      # instead, specifically so this integration's own tests can run
      # against genuinely unreleased python-mobius changes -- exactly
      # the situation whenever this project is waiting on a
      # python-mobius release that hasn't happened yet. pip always
      # resolves a VCS requirement like this fresh (not served from its
      # own package-download cache the way a normal PyPI install would
      # be), so this genuinely tracks that branch's current HEAD on
      # every run, not a stale clone from an earlier one.
      - name: Install python-mobius from its own git repo (not PyPI)
        if: github.ref_type != 'tag'
        run: pip install "git+https://code.r3pek.org/r3pek/python-mobius.git"

      # `python -m pytest`, not bare `pytest` -- the former puts the
      # repo root on sys.path, which custom_components.mobius needs.
      - name: Run tests
        run: python -m pytest tests/ -q

  frontend:
    # Separate job from `test` above (not an extra step in it) so the
    # two run in parallel and a failure here is unambiguous about
    # which side (Python integration vs. the Lovelace card build)
    # actually broke, rather than one long job conflating both.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend-src
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Set up Node.js
        uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-src/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm test` runs the full pipeline (see package.json): type
      # check, lint, format check, build (dist/ is never committed --
      # see this directory's own README.md), then executes the actual
      # built output in a real jsdom DOM environment -- not a mock of
      # the card's own logic. A genuine type error, lint violation,
      # formatting drift, or compile failure surfaces here just as
      # much as a logic bug the tests themselves would catch.
      - name: Build and test
        run: npm test
