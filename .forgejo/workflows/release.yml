name: Release

# Triggers on tags matching v* (e.g. v0.2.0), or manually via
# workflow_dispatch for testing this workflow itself.
"on":
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  # Calls test.yml and validate.yml as reusable workflows rather than
  # duplicating their steps. "release" below (needs: [test, validate])
  # never runs if either fails.
  test:
    uses: ./.forgejo/workflows/test.yml

  validate:
    uses: ./.forgejo/workflows/validate.yml
    # Explicit, not secrets: inherit -- validate.yml only actually
    # needs this one secret. Confirmed by a REAL failure this actually
    # matters (not just theoretical): the HACS validation step passed
    # when validate.yml was triggered standalone, then failed with a
    # 401 specifically when triggered through this call instead --
    # without this block, that's exactly what happens again.
    secrets:
      GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}

  release:
    needs: [test, validate]
    # ubuntu-22.04 -> catthehacker/ubuntu:act-22.04, the only one of this
    # runner's labels with a full GitHub-Actions-compatible environment.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      # No Python setup needed -- the only script this job runs
      # (extract_changelog_section.py) is stdlib-only.

      # Pulls the CHANGELOG.md section for this tag's version (v0.2.0 ->
      # "## 0.2.0") as the release notes, rather than auto-generating
      # from commits. Fails the job if no matching section is found.
      # Only on a real tag push -- workflow_dispatch has no version to
      # look up.
      - name: Extract changelog section for this version
        if: github.event_name == 'push'
        run: python3 .forgejo/scripts/extract_changelog_section.py "${{ github.ref_name }}"

      # Zips the CONTENTS of custom_components/mobius (not the folder
      # itself) for anyone installing manually instead of via HACS,
      # which installs from the tagged source directly either way.
      - name: Build release zip
        if: github.event_name == 'push'
        run: |
          mkdir -p dist/release
          cd custom_components/mobius
          find . -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          zip -r ../../dist/release/mobius.zip .

      - name: Create Forgejo release
        if: github.event_name == 'push'
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          url: https://code.r3pek.org
          repo: r3pek/ha-mobius
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          release-dir: dist/release
          release-notes-file: release_notes.md

      # Mirrors the release to GitHub (github.com/r3pek/ha-mobius) --
      # HACS reads real GitHub releases from there.
      #
      # Uses `gh` CLI directly, not a Node action: this runner doesn't
      # let a step's own env override GITHUB_API_URL, which a
      # Node-based action needs to avoid resolving to the Forgejo
      # instance itself. `gh` doesn't read that variable at all, so it
      # isn't affected either way.
      #
      # GH_TOKEN (not GITHUB_TOKEN) wins over whatever Forgejo-scoped
      # token the runner sets on its own. Needs write access on the
      # mirror -- confirm GH_MIRROR_TOKEN actually has it.
      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            SUDO=$(command -v sudo || true)
            $SUDO mkdir -p -m 755 /etc/apt/keyrings
            wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | $SUDO tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
            $SUDO chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | $SUDO tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            $SUDO apt-get update -qq
            $SUDO apt-get install -y gh
          fi
          gh release create "${{ github.ref_name }}" dist/release/mobius.zip \
            --repo r3pek/ha-mobius \
            --title "${{ github.ref_name }}" \
            --notes-file release_notes.md
