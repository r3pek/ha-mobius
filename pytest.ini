[pytest]
asyncio_mode = auto
filterwarnings =
    # Any test that runs this integration's own real setup lifecycle
    # (it declares bluetooth_adapters as a dependency, per manifest.json)
    # triggers the REAL bluetooth component's own scanner startup, which
    # tries to connect to the actual system's BlueZ D-Bus socket --
    # pytest-socket blocks that connection and reports it as a warning
    # (shown as a CI annotation on top of that). bleak-retry-connector
    # itself already catches the resulting exception gracefully (logged
    # at debug level, nothing actually fails) -- this is a known,
    # harmless side effect of testing a Bluetooth-dependent integration
    # in a sandboxed environment with no real BlueZ daemon, not a real
    # issue with any test here. Confirmed the alternative (Home
    # Assistant's own official enable_bluetooth fixture, which properly
    # mocks the scanner instead of just silencing the warning) causes
    # its own, worse problems when applied broadly -- real config-entry
    # lifecycle interactions leaving lingering timers behind across
    # several, otherwise-unrelated tests -- so suppressing the warning
    # itself, precisely, is the safer choice here.
    ignore:A test tried to use socket.socket.connect\(\) with host "None":UserWarning
